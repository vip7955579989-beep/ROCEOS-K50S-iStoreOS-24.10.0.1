name: Build iStoreOS 24.10 for ROCEOS K50S

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/istoreos/istoreos.git
  REPO_BRANCH: istoreos-24.10
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools python3-setuptools python3-pip \
            rsync unzip zlib1g-dev file msmtp texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake \
            libtool sed subversion patch lib32gcc-s1 libc6-dev-i386 device-tree-compiler
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone Source Code
        working-directory: /workdir
        run: |
          df -h
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: Setup Custom Feeds (iStore Center)
        run: |
          cd openwrt
          [ -e $GITHUB_WORKSPACE/diy-part1.sh ] && chmod +x $GITHUB_WORKSPACE/diy-part1.sh && $GITHUB_WORKSPACE/diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject ROCEOS K50S DTS & Device Configurations
        run: |
          cd openwrt
          # 1. 注入 DTS 到内核源码树与 target 检索树
          mkdir -p target/linux/rockchip/files/arch/arm64/boot/dts/rockchip
          mkdir -p target/linux/rockchip/dts/rockchip
          mkdir -p target/linux/rockchip/dts/rk3568

          if [ -d "$GITHUB_WORKSPACE/patches" ] && [ -f "$GITHUB_WORKSPACE/patches/rk3568-roc-k50s.dts" ]; then
            SRC_DIR="$GITHUB_WORKSPACE/patches"
            cp -f $SRC_DIR/rk3568-roc-k50s.dts target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
            cp -f $SRC_DIR/rk3568-roc-k50s.dtsi target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/
          fi

          # 同步至各级 DTS 检索目录
          cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.dts target/linux/rockchip/dts/rockchip/
          cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.dtsi target/linux/rockchip/dts/rockchip/
          cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.dts target/linux/rockchip/dts/rk3568/
          cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.dtsi target/linux/rockchip/dts/rk3568/

          # 2. 执行自定义拓展脚本 diy-part2.sh
          [ -e $GITHUB_WORKSPACE/diy-part2.sh ] && chmod +x $GITHUB_WORKSPACE/diy-part2.sh && $GITHUB_WORKSPACE/diy-part2.sh

          # 3. 加载仓库中的 k50s.config (避免硬编码覆盖)
          if [ -f "$GITHUB_WORKSPACE/k50s.config" ]; then
            cp -f $GITHUB_WORKSPACE/k50s.config .config
          fi

      - name: Download DL Packages
        run: |
          cd openwrt
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Pre-build Kernel Prepare & Sync DTS
        run: |
          cd openwrt
          make target/linux/prepare -j$(nproc) || true
          for dts_dir in build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/linux-*/arch/arm64/boot/dts/rockchip; do
            if [ -d "$dts_dir" ]; then
              cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.* "$dts_dir/"
              if [ -f "$dts_dir/Makefile" ] && ! grep -q "rk3568-roc-k50s.dtb" "$dts_dir/Makefile"; then
                echo "dtb-\$(CONFIG_ARCH_ROCKCHIP) += rk3568-roc-k50s.dtb" >> "$dts_dir/Makefile"
              fi
            fi
          done

      - name: Compile Firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || {
            for dts_dir in build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/linux-*/arch/arm64/boot/dts/rockchip; do
              if [ -d "$dts_dir" ]; then
                cp -f target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/rk3568-roc-k50s.* "$dts_dir/"
              fi
            done
            make -j1 V=s
          }
          echo "status=success" >> $GITHUB_OUTPUT
          SOURCE_DATE=$(date +%Y%m%d)
          echo "SOURCE_DATE=$SOURCE_DATE" >> $GITHUB_ENV

      - name: Organize Firmware Output
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          cd openwrt/bin/targets/rockchip/armv8
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: iStoreOS-24.10-ROCEOS-K50S-${{ env.SOURCE_DATE }}
          path: ${{ env.FIRMWARE }}

      - name: Generate Release Tag
        id: tag
        if: steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=v24.10.0.1-ROCEOS-K50S-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          touch release.txt
          echo "## iStoreOS 24.10 for ROCEOS K50S" >> release.txt
          echo "- **Kernel**: Linux 6.6 (Rockchip ARMv8)" >> release.txt
          echo "- **Hardware**: RK3568, 3x RTL8125BG 2.5G, 2x RTL8211FS SFP" >> release.txt
          echo "- **Default IP**: 192.168.100.1 (Username: root, Password: password)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
